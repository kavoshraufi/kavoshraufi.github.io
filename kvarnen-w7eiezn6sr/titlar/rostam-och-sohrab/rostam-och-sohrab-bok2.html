:root{
  --serif:'Cormorant Garamond',Palatino,'Palatino Linotype',Georgia,serif;
  --display:var(--serif);
  --persian:'Noto Nastaliq Urdu','Noto Naskh Arabic',serif;
  --ink:#2a2118;
  --ink-soft:#5a4c3a;
  --head:#1a140c;
  --paper:#f3e6c8;
  --gold:#c9a24a;
  --gold-lt:#f0d78c;
  --gold-dk:#8a6320;
  --leather:#1a2d4d;
  --night:#0b1020;
  --accent:#7a1f2b;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --tex-leather:none;
  --tex-paper:none;
  --tex-wood:none;
  --tex-gilt:none;
  --tex-filigree:none;
  --yaw:-32deg;
  --pitch:16deg;
  --open:0deg;
  --thick:42px;
  --left-thick:6px;
  --right-thick:36px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--night);color:var(--ink);font-family:var(--serif);overflow:hidden;touch-action:manipulation;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
#app{position:fixed;inset:0;overflow:hidden}
/* ===== Desk / cover scene ===== */
.scene-cover{
  position:absolute;inset:0;
  background:#0a0710 var(--tex-wood) center/cover;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:calc(var(--safe-t) + 12px) 16px calc(var(--safe-b) + 16px);
}
.scene-cover::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 78% 18%,rgba(255,200,110,.22),transparent 42%),
    radial-gradient(ellipse at 50% 80%,rgba(0,0,0,.35),transparent 55%),
    linear-gradient(180deg,rgba(0,0,0,.25),transparent 30%,rgba(0,0,0,.5));
}
.motes{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.motes i{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffe9b0;opacity:.6;animation:mote 9s linear infinite}
@keyframes mote{from{transform:translateY(10px)}to{transform:translateY(-110vh)}}
.candle{
  position:absolute;right:8%;top:10%;width:24px;height:90px;pointer-events:none;opacity:.9;
  background:linear-gradient(#f4e0b0,#e8c98a 70%,#7a5a30);
  border-radius:3px 3px 2px 2px;
  box-shadow:0 0 60px 16px rgba(255,180,70,.28);
}
.candle::after{
  content:"";position:absolute;left:50%;top:-16px;width:12px;height:20px;margin-left:-6px;
  background:radial-gradient(circle at 50% 30%,#fff6c8,#ffb347 40%,transparent 70%);
  animation:flick 1.8s ease-in-out infinite;
}
@keyframes flick{50%{transform:scaleY(1.15) scaleX(.9);opacity:.85}}
.stage3d{
  position:relative;z-index:2;
  width:min(52vw,46vh,340px);
  height:calc(min(52vw,46vh,340px) * 1.32);
  margin-top:2vh;
  perspective:1400px;perspective-origin:50% 40%;
  touch-action:none;
}
.book-shadow{
  position:absolute;left:8%;right:4%;bottom:-6%;height:18%;
  background:radial-gradient(ellipse,rgba(0,0,0,.55),transparent 70%);
  filter:blur(6px);pointer-events:none;z-index:1;
}
.book3d{
  position:relative;z-index:2;width:100%;height:100%;
  transform-style:preserve-3d;
  transform:rotateX(var(--pitch)) rotateY(var(--yaw));
  will-change:transform;
}
.bface{
  position:absolute;background-color:#16253f;
  background-image:var(--tex-leather);background-size:cover;
  box-shadow:inset 0 0 30px rgba(0,0,0,.35);
  backface-visibility:hidden;
}
.bface.front,.bface.back,.cover-front,.cover-inside{
  width:100%;height:100%;left:0;top:0;
}
.bface.front{transform:translateZ(calc(var(--thick) / 2))}
.bface.back{transform:rotateY(180deg) translateZ(calc(var(--thick) / 2))}
.bface.spine{
  width:var(--thick);height:100%;left:0;top:0;
  transform:rotateY(-90deg) translateZ(calc(var(--thick) / 2));
  transform-origin:left center;
  background-image:linear-gradient(90deg,rgba(0,0,0,.35),transparent 30%,transparent 70%,rgba(255,220,140,.08)),var(--tex-leather);
}
.bface.edge-r{
  width:var(--thick);height:100%;right:0;top:0;
  transform:rotateY(90deg) translateZ(calc(var(--thick) / 2));
  transform-origin:right center;
  background:var(--tex-gilt) center/100% auto;background-color:#c9a24a;
  backface-visibility:hidden;
}
.bface.edge-t,.bface.edge-b{
  width:100%;height:var(--thick);left:0;
  background:var(--tex-gilt) center/auto 100%;background-color:#d4b46a;
}
.bface.edge-t{top:0;transform:rotateX(90deg) translateZ(calc(var(--thick) / 2));transform-origin:center top}
.bface.edge-b{bottom:0;transform:rotateX(-90deg) translateZ(calc(var(--thick) / 2));transform-origin:center bottom}
.cover-hinge{
  position:absolute;inset:0;transform-style:preserve-3d;
  transform-origin:left center;
  transform:translateZ(calc(var(--thick) / 2 + 0.6px)) rotateY(var(--open));
  will-change:transform;
}
.cover-front,.cover-inside{
  position:absolute;inset:0;
  background-color:#16253f;background-image:var(--tex-leather);background-size:cover;
  backface-visibility:hidden;
}
.cover-inside{
  transform:rotateY(180deg);
  background-image:linear-gradient(135deg,rgba(90,20,30,.55),rgba(20,30,50,.5)),var(--tex-paper);
  background-size:auto,cover;
  border:10px solid #1a2d4d;
}
.filigree{
  position:absolute;inset:0;pointer-events:none;opacity:1;
}
.filigree svg{width:100%;height:100%;display:block}
.medallion{
  position:absolute;left:50%;top:42%;width:46%;aspect-ratio:5/6;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background-image:var(--art-cover);background-size:cover;background-position:var(--cover-pos, center 40%);
  box-shadow:0 0 0 3px #c9a24a,0 0 0 6px #8a6320,0 8px 18px rgba(0,0,0,.45),inset 0 0 12px rgba(0,0,0,.25);
}
.corners .cap{
  position:absolute;width:14%;height:10%;
  background:linear-gradient(135deg,#f0d78c,#8a6320 55%,#c9a24a);
  box-shadow:inset 0 0 3px rgba(255,240,180,.7),0 1px 3px rgba(0,0,0,.4);
}
.corners .cap.tl{left:0;top:0;clip-path:polygon(0 0,100% 0,0 100%)}
.corners .cap.tr{right:0;top:0;clip-path:polygon(0 0,100% 0,100% 100%)}
.corners .cap.bl{left:0;bottom:0;clip-path:polygon(0 0,0 100%,100% 100%)}
.corners .cap.br{right:0;bottom:0;clip-path:polygon(100% 0,100% 100%,0 100%)}
.spine-bands{position:absolute;inset:0;pointer-events:none}
.spine-bands b{position:absolute;left:8%;right:8%;height:7%;background:linear-gradient(90deg,#8a6320,#f0d78c 40%,#c9a24a 70%,#8a6320);border-radius:1px;opacity:.85}
.spine-bands b:nth-child(1){top:12%}
.spine-bands b:nth-child(2){top:22%}
.spine-bands b:nth-child(3){bottom:22%}
.spine-bands b:nth-child(4){bottom:12%}
.spine-title{
  position:absolute;inset:30% 0 30%;display:flex;align-items:center;justify-content:center;
  color:#f0d78c;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  writing-mode:vertical-rl;transform:rotate(180deg);text-shadow:0 1px 0 #3a2508;
  font-weight:600;
}
.cover-title{
  position:absolute;left:10%;right:10%;bottom:11%;text-align:center;color:#f3e0a6;
  text-shadow:0 1px 2px #1a1008;pointer-events:none;
}
.cover-title .fa{font-family:var(--persian);font-size:1.35rem;line-height:2;direction:rtl}
.cover-title h1{font-size:1.05rem;margin:.15em 0 0;font-weight:600;letter-spacing:.04em}
.cover-ui{
  position:relative;z-index:4;margin-top:22px;width:min(92vw,420px);text-align:center;
  color:#f4ead4;
}
.lang-row{display:flex;gap:12px;justify-content:center;margin:8px 0 10px}
.lang-card,.seal-btn,.ghost-link{
  position:relative;padding:10px 18px;border-radius:4px;
  color:#f3e0a6;letter-spacing:.04em;
  background:
    linear-gradient(#2a1c0a,#1a1208);
  box-shadow:0 0 0 1px #8a6320,0 0 0 2px #f0d78c,0 0 0 3px #8a6320,0 6px 16px rgba(0,0,0,.45);
}
.lang-card b{display:block;font-size:1.05rem}
.lang-card small{display:block;font-family:var(--persian);direction:rtl;opacity:.8;font-size:.85rem;margin-top:2px}
.lang-card:active,.seal-btn:active{transform:scale(.98)}
.seal-btn{margin:8px auto;display:inline-block;font-weight:600;padding:11px 26px}
.ghost-link{background:transparent;box-shadow:none;border:0;color:#e8d7b0;text-decoration:underline;text-underline-offset:3px;display:inline-block;margin-top:6px;padding:6px}
.hint{color:#d4c4a0;font-size:.92rem;margin:6px 0 0;min-height:1.3em}
.sound{
  position:absolute;z-index:8;top:calc(var(--safe-t) + 10px);right:calc(var(--safe-r) + 10px);
  width:40px;height:40px;border-radius:50%;
  background:radial-gradient(circle at 40% 30%,#f0d78c,#8a6320);
  color:#1a1408;font-weight:700;box-shadow:0 2px 8px rgba(0,0,0,.4);
}
.sound.off{filter:grayscale(.6);opacity:.7}

/* ===== Open book ===== */
.scene-read{
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 90% 36% at 50% 0%,rgba(255,198,110,.38),rgba(255,160,70,.08) 42%,transparent 70%),
    radial-gradient(ellipse 80% 28% at 70% 100%,rgba(255,170,80,.16),transparent 60%),
    linear-gradient(180deg,#1c100a 0%,#3a2416 16%,#4d301c 50%,#2a1810 86%,#140c08 100%),
    var(--tex-wood) center / 420px auto;
  display:flex;align-items:center;justify-content:center;
  padding:calc(var(--safe-t) + 8px) 8px calc(var(--safe-b) + 8px);
}
.scene-read::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 50% 42%,transparent 36%,rgba(0,0,0,.32) 100%),
    linear-gradient(180deg,rgba(255,200,120,.08),transparent 16%,transparent 80%,rgba(0,0,0,.28));
}
.desk{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.desk-glow{
  position:absolute;left:10%;top:-12%;width:80%;height:46%;
  background:radial-gradient(ellipse at 50% 20%,rgba(255,210,130,.4),rgba(255,160,60,.1) 46%,transparent 72%);
}
.blotter{
  position:absolute;left:4%;right:4%;top:8%;bottom:8%;
  border-radius:40% 42% 46% 44%;
  background:
    radial-gradient(ellipse at 50% 50%,rgba(80,28,24,.0) 42%,rgba(60,22,18,.22) 62%,rgba(30,12,8,.0) 78%);
  box-shadow:inset 0 0 0 1px rgba(255,200,130,.04);
}
.desk-candle{
  position:absolute;right:7%;bottom:14px;width:13px;height:38px;
  background:linear-gradient(#f7e6b8,#e8c98a 70%,#6a4a28);
  border-radius:2px 2px 1px 1px;
  box-shadow:0 0 28px 12px rgba(255,180,70,.28), 0 0 60px 18px rgba(255,140,40,.12);
  opacity:.9;
  z-index:3;
}
.desk-candle::after{
  content:"";position:absolute;left:50%;top:-13px;width:10px;height:16px;margin-left:-5px;
  background:radial-gradient(circle at 50% 30%,#fff8d0,#ffb347 42%,transparent 72%);
  animation:flick 2.2s ease-in-out infinite;
}
.book-open{box-shadow:0 22px 40px rgba(0,0,0,.45),0 2px 0 rgba(255,210,140,.12),0 0 0 1px rgba(40,24,10,.4)}
.book-open{
  position:relative;z-index:2;
  width:min(96vw, calc(96vh * 1.45));
  height:min(92vh, calc(96vw * .78));
  max-width:1100px;
  transform-style:preserve-3d;
  filter:drop-shadow(0 18px 28px rgba(0,0,0,.5));
}
.board{
  position:absolute;background:#16253f var(--tex-leather) center/cover;
  box-shadow:inset 0 0 20px rgba(0,0,0,.4);
}
.board-left{left:0;top:0;bottom:0;width:calc(50% + 4px);border-radius:4px 0 0 4px;transform-origin:right center}
.board-right{right:0;top:0;bottom:0;width:calc(50% + 4px);border-radius:0 4px 4px 0}
.spread-wrap{
  position:absolute;inset:3.2% 4.2% 3.6% 4.2%;
  display:flex;align-stretch;justify-content:center;
}
.stack{
  position:relative;flex:0 0 auto;align-self:stretch;
  background:var(--tex-gilt) center/100% auto;background-color:#d4b46a;
  box-shadow:inset 0 0 4px rgba(80,50,10,.4);
}
.stack-left{width:var(--left-thick);border-radius:2px 0 0 2px;margin-right:-1px}
.stack-right{width:var(--right-thick);border-radius:0 2px 2px 0;margin-left:-1px}
.leaves{
  position:relative;flex:1 1 auto;display:flex;min-width:0;height:100%;
  perspective:2200px;
}
.leaf{
  position:relative;flex:1 1 50%;min-width:0;height:100%;
  background-color:var(--paper);
  background-image:var(--tex-paper);
  background-size:220px 220px;
  color:var(--ink);
  overflow:hidden;
  box-shadow:inset 0 0 28px rgba(90,60,20,.08);
}
.leaf.left{border-radius:1px 0 0 1px;box-shadow:inset -18px 0 22px -16px rgba(40,24,8,.28),inset 0 0 28px rgba(90,60,20,.08)}
.leaf.right{border-radius:0 1px 1px 0;box-shadow:inset 18px 0 22px -16px rgba(40,24,8,.28),inset 0 0 28px rgba(90,60,20,.08)}
.leaf.single{flex-basis:100%;border-radius:1px;max-width:100%}
.gutter{width:0;position:relative;z-index:3;pointer-events:none}
.gutter::before{
  content:"";position:absolute;top:0;bottom:0;left:-14px;width:28px;
  background:linear-gradient(90deg,transparent,rgba(40,24,8,.22) 50%,transparent);
}
.leaf-inner{
  position:absolute;inset:0 0 1.65em 0;
  padding:7% 8% 3.5%;
  overflow:hidden;
  --fit: 1;
}
.page-ornament{
  position:absolute;inset:3%;pointer-events:none;
  border:1px solid rgba(201,162,74,.35);
  box-shadow:inset 0 0 0 3px rgba(243,230,200,.5),inset 0 0 0 4px rgba(201,162,74,.2);
}
.page-ornament i{position:absolute;width:22px;height:22px;background:var(--tex-filigree);background-size:800% 800%;opacity:.85}
.page-ornament i.tl{left:-2px;top:-2px;background-position:0 0}
.page-ornament i.tr{right:-2px;top:-2px;background-position:100% 0;transform:scaleX(-1)}
.page-ornament i.bl{left:-2px;bottom:-2px;background-position:0 100%;transform:scaleY(-1)}
.page-ornament i.br{right:-2px;bottom:-2px;background-position:100% 100%;transform:scale(-1)}

/* flipper / paper curl */
.flipper{
  position:absolute;top:0;bottom:0;width:50%;
  transform-origin:left center;
  transform-style:preserve-3d;
  pointer-events:none;
  z-index:6;
  overflow:visible;
}
.flipper.forward{right:0;left:auto;transform-origin:left center}
.flipper.back{left:0;right:auto;transform-origin:right center}
.flipper.curl{display:flex;align-items:stretch}
.curl-strip{
  position:relative;flex:1 1 0;height:100%;min-width:0;
  transform-style:preserve-3d;
  transform-origin:left center;
  will-change:transform;
}
.flipper.back .curl-strip{transform-origin:right center}
.curl-face{
  position:absolute;inset:0;overflow:hidden;
  background-color:var(--paper);background-image:var(--tex-paper);background-size:220px 220px;
  backface-visibility:hidden;-webkit-backface-visibility:hidden;
  box-shadow:0 10px 22px rgba(20,10,0,.16);
}
.curl-front{transform:rotateY(0deg)}
.curl-back{transform:rotateY(180deg)}
.curl-sheet{
  position:absolute!important;top:0;bottom:0;height:100%;
  margin:0;border:0;box-shadow:none;border-radius:0;
  overflow:hidden;
}
.curl-shade{
  position:absolute;inset:0;pointer-events:none;z-index:4;
  opacity:0;
}
.curl-cast{
  position:absolute;top:0;bottom:0;width:22%;pointer-events:none;z-index:5;
  opacity:0;
}
.under-shade{
  position:absolute;inset:0;pointer-events:none;z-index:3;
  background:linear-gradient(90deg,rgba(40,20,8,.35),transparent 55%);
  opacity:0;
}
.fade-layer{
  position:absolute;inset:0;z-index:7;pointer-events:none;opacity:0;
  background-color:var(--paper);
  overflow:hidden;
}
.dogear{
  position:absolute;z-index:5;width:36px;height:36px;pointer-events:auto;touch-action:none;
  background:linear-gradient(135deg,transparent 50%,rgba(201,162,74,.28) 50%);
  opacity:.55;
}
.dogear.next{right:0;bottom:0}
.dogear.prev{left:0;bottom:0;transform:scaleX(-1)}
.edge-hit{
  position:absolute;top:0;bottom:0;width:36px;z-index:5;touch-action:none;
}
.edge-hit.next{right:0}
.edge-hit.prev{left:0}

/* typography */
.kicker{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-dk);display:block;margin-bottom:.4em}
.leaf h1,.leaf h2,.cover-title h1,.spine-title{font-family:var(--display)}
.leaf h1,.leaf h2{font-weight:600;color:var(--head);line-height:1.2;margin:.1em 0 .45em}
.leaf h1{font-size:calc(1.7rem * var(--fit, 1));text-align:center}
.leaf h2{font-size:calc(1.28rem * (0.62 + 0.38 * var(--fit, 1)))}
.leaf p{margin:0 0 calc(.75em * var(--fit, 1));line-height:calc(1.36 + 0.26 * var(--fit, 1));font-size:calc(1.02rem * var(--fit, 1));hyphens:auto}
.muted{color:var(--ink-soft)}
.fa-line{font-family:var(--persian);direction:rtl;text-align:center;font-size:1.35rem;line-height:2.2;color:#1c2a44;margin:.2em 0 .6em}
.drop{
  float:left;font-size:calc(3.2rem * var(--fit, 1));line-height:1;margin:0 10px 0 0;padding:8px 10px 6px;
  color:#7a1f2b;font-weight:600;
  border:1.5px solid var(--gold);
  background:
    radial-gradient(circle at 30% 30%,rgba(240,215,140,.45),transparent 60%),
    linear-gradient(#efe3c6,#e4d2a8);
  box-shadow:0 0 0 3px rgba(201,162,74,.18),inset 0 0 8px rgba(201,162,74,.25);
  min-width:1.15em;text-align:center;
}
.verse{font-family:var(--persian);direction:rtl;text-align:right;font-size:1.18rem;line-height:2.35;color:#1c2a44}
.verse .bayt{display:block;margin:0 0 .35em}
.verse-box{position:relative;min-height:8em}
.src{font-size:.68rem;color:var(--ink-soft);margin-top:10px;line-height:1.4;word-break:break-all}
.illu{
  width:100%;aspect-ratio:16/9;max-height:calc(5.5em + 7.5em * var(--fit, 1));margin:0 0 calc(12px * var(--fit, 1));border:2px solid var(--gold);
  box-shadow:0 0 0 3px rgba(201,162,74,.2),0 4px 10px rgba(60,40,10,.15);
  background-size:cover;background-position:center;border-radius:2px;
}
.illu.portrait{aspect-ratio:4/3}
.frame-hit{
  position:relative;display:block;width:100%;margin:8px 0 4px;padding:0;text-align:left;
  border:2px solid var(--gold);
  box-shadow:0 0 0 3px rgba(201,162,74,.18),0 0 18px rgba(201,162,74,.25);
  border-radius:3px;overflow:hidden;cursor:pointer;
  animation:glim 2.8s ease-in-out infinite;
}
.frame-hit .illu{margin:0;border:0;box-shadow:none;aspect-ratio:16/8}
.frame-hit .cap{
  display:block;padding:6px 10px 8px;background:linear-gradient(180deg,#efe3c6,#e8d4a8);
  font-size:.82rem;color:var(--gold-dk);letter-spacing:.06em;text-align:center;
}
@keyframes glim{
  0%,100%{box-shadow:0 0 0 3px rgba(201,162,74,.18),0 0 10px rgba(201,162,74,.15)}
  50%{box-shadow:0 0 0 3px rgba(201,162,74,.35),0 0 22px rgba(240,215,140,.55)}
}
.seal{
  display:block;margin:14px auto 0;padding:8px 18px;
  background:radial-gradient(circle at 40% 30%,#b03a3a,#6e1620);
  color:#f8e6c8;border-radius:50%;width:74px;height:74px;
  box-shadow:0 0 0 3px var(--gold),0 4px 10px rgba(80,0,0,.3);
  font-size:.72rem;letter-spacing:.04em;text-align:center;line-height:1.2;
}
.toc-list{list-style:none;margin:0;padding:0;column-count:2;column-gap:.8em}
.toc-list li{margin:0;break-inside:avoid}
.toc-list button{
  display:flex;justify-content:space-between;align-items:baseline;gap:6px;
  width:100%;text-align:left;padding:calc(4px * var(--fit, 1) + 1px) 0;
  border-bottom:1px dotted rgba(201,162,74,.45);
  color:var(--ink);font-size:calc(.92rem * (0.72 + 0.28 * var(--fit, 1)));
  line-height:1.25;
}
.toc-list button[disabled]{opacity:.4}
.toc-list .num{color:var(--gold-dk);font-variant-numeric:oldstyle-nums;min-width:1.4em}
.toc-list .ttl{flex:1;min-width:0}
.toc-list .pg{color:var(--ink-soft);font-size:.85em}
.milestone-block{
  margin:calc(.5em * var(--fit, 1)) 0 0;padding:calc(.45em * var(--fit, 1)) .6em;
  border:1px solid rgba(201,162,74,.45);border-radius:3px;
  background:linear-gradient(180deg,rgba(240,215,140,.2),rgba(243,230,200,.35));
}
.milestone-block .mile-title{font-family:var(--display);font-weight:600;margin:0 0 .25em;font-size:calc(1.02rem * (0.7 + 0.3 * var(--fit, 1)))}
.milestone-block p{margin:0 0 .3em}
.mile-more,.more-btn{
  display:inline-block;margin-top:.15em;padding:0;border:0;background:none;
  color:var(--gold-dk);text-decoration:underline;text-underline-offset:2px;
  font-size:.85em;cursor:pointer;
}
.leaf-inner.fit-tight .frame-hit.compact .illu{height:0;min-height:0;opacity:0;overflow:hidden}
.leaf-inner.fit-tight .frame-hit{margin:3px 0}
.leaf-inner.fit-tight .frame-row{margin:4px 0}
.leaf-inner.fit-tight .illu:not(.frame-hit .illu){max-height:calc(4.2em + 3em * var(--fit, 1))}
.colophon .frame-hit .illu{max-height:5.5em}
.frontis{text-align:center;padding-top:8%}
.frontis .fa-line{font-size:1.8rem;margin:12px 0}
.rule{height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);border:0;margin:12px 20%}

/* map */
.map-page{position:relative;width:100%;aspect-ratio:3/4;min-height:210px;margin-top:4px;overflow:hidden;border-radius:3px}
.map-scenery{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.map-scenery .layer{
  position:absolute;inset:-4%;
  background-size:cover;background-position:center;
  opacity:0;filter:saturate(.35) contrast(.95) brightness(.9);
  transition:opacity 1.35s ease,filter 1.35s ease,transform 1.6s ease;
  transform:scale(1.04);
}
.map-scenery .layer.on{opacity:.42;filter:saturate(.8) contrast(1) brightness(1);transform:scale(1)}
.map-scenery .layer.current{opacity:.62;filter:none;transform:scale(1.01)}
.map-veil{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(243,230,200,.18),rgba(243,230,200,.72) 78%,rgba(243,230,200,.88));
}
.map-path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1}
.map-path path{stroke-dasharray:2 1.4;transition:stroke-dashoffset 1.2s ease,opacity .8s ease}
.valley{position:absolute;transform:translate(-50%,-60%);width:22%;padding:0;background:none;border:0;text-align:center;z-index:2}
.valley .shot{
  display:block;width:100%;aspect-ratio:16/10;
  background-size:cover;background-position:var(--pos,center);
  border:1.5px solid var(--gold);border-radius:2px;
  filter:grayscale(1) sepia(.55) contrast(.9) brightness(1.05);
  transition:filter 1.1s ease,transform .8s ease,box-shadow .8s ease,opacity .8s ease;
  box-shadow:0 2px 6px rgba(40,24,8,.2);
  transform:scale(.96);opacity:.85;
}
.valley.unlocked .shot{filter:var(--tint,none);transform:scale(1);opacity:1}
.valley.current .shot{filter:none;box-shadow:0 0 0 2px var(--gold),0 0 10px rgba(201,162,74,.55);transform:scale(1.04);opacity:1}
.valley .vlbl{display:block;font-size:.68rem;margin-top:3px;color:var(--ink);line-height:1.2}
.valley .you-are{display:block;font-size:.58rem;color:var(--gold-dk);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.valley.appear{animation:growIn .9s ease both}
@keyframes growIn{from{opacity:1;transform:translate(-50%,-60%) scale(.92)}to{opacity:1;transform:translate(-50%,-60%) scale(1)}}

/* sprites */
.spr{display:inline-block;background-repeat:no-repeat;flex-shrink:0;pointer-events:none;vertical-align:middle}
.guide-row{display:flex;justify-content:center;gap:10px;margin:8px 0 12px;align-items:flex-end}

/* overlay panel (cut scene) */
.overlay{
  position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
  background:rgba(8,6,12,.52);
  padding:calc(var(--safe-t) + 16px) 16px calc(var(--safe-b) + 16px);
}
.panel{
  width:min(92vw,460px);max-height:100%;overflow-y:auto;
  background:var(--paper) var(--tex-paper) center/cover;
  color:var(--ink);
  border:2px solid var(--gold);
  box-shadow:0 0 0 5px rgba(26,20,12,.7),0 0 0 6px var(--gold-dk),0 20px 50px rgba(0,0,0,.5),0 0 40px rgba(201,162,74,.25);
  border-radius:4px;padding:22px 20px 18px;position:relative;
}
.panel h2{margin:.1em 0 .4em;font-size:1.4rem}
.panel .close-x{
  position:absolute;top:8px;right:10px;width:32px;height:32px;color:var(--gold-dk);font-size:1.3rem;
}
textarea,input[type=text]{
  width:100%;margin:8px 0 10px;padding:10px 12px;
  background:rgba(255,255,255,.35);border:1px solid rgba(201,162,74,.55);
  border-radius:3px;color:var(--ink);resize:vertical;min-height:0;
}
textarea{min-height:7em}
.gold-btn{
  display:block;width:100%;margin-top:10px;padding:12px 16px;
  background:linear-gradient(180deg,#f0d78c,#c9a24a 55%,#8a6320);
  color:#1a1408;font-weight:600;letter-spacing:.03em;
  border-radius:3px;
  box-shadow:0 1px 0 #fff3c4 inset,0 3px 8px rgba(80,50,10,.3);
}
.gold-btn:active{transform:scale(.98)}
.gold-btn[disabled]{opacity:.45}
.linkish{display:block;width:100%;margin-top:8px;padding:8px;color:var(--gold-dk);text-decoration:underline;text-underline-offset:3px;background:none;border:0}
.birds{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.bird{
  display:flex;flex-direction:column;align-items:center;text-align:center;
  padding:8px 6px;border:1px solid rgba(201,162,74,.5);border-radius:3px;
  background:rgba(255,255,255,.25);
}
.bird b{display:block;margin:4px 0 2px}
.bird small{font-size:.72rem;color:var(--ink-soft);line-height:1.35}
.err{color:#7a1f2b;font-size:.9rem}
.toast{
  position:absolute;z-index:30;left:50%;bottom:calc(var(--safe-b) + 20px);
  transform:translateX(-50%);
  background:#1a1408;color:#f4ead4;padding:8px 14px;border-radius:4px;
  border:1px solid var(--gold);font-size:.9rem;pointer-events:none;
}

/* gestures */
.gesture{position:relative;height:180px;margin:10px 0;background:rgba(40,30,16,.06);border:1px dashed rgba(201,162,74,.4);border-radius:4px;touch-action:none}
.g-path{position:absolute;left:10%;right:10%;top:45%;height:10px;border-radius:6px;background:linear-gradient(90deg,#c9a24a,#efe3c6);}
.g-ember{width:70px;height:70px;margin:40px auto;border-radius:50%;background:radial-gradient(circle at 40% 35%,#f8e0a0,#c25a1a 55%,#5a1208);box-shadow:0 0 16px rgba(255,140,40,.4);transition:transform .6s ease,box-shadow .6s}
.g-ember.hot{transform:scale(1.2);box-shadow:0 0 28px rgba(255,180,60,.8)}
.g-sign{position:absolute;width:36px;height:36px;border-radius:50%;background:rgba(201,162,74,.15);border:1px solid rgba(201,162,74,.3)}
.g-sign.found{background:rgba(201,162,74,.7)}
.g-stone{position:absolute;width:48px;height:36px;border-radius:40% 40% 45% 45%;background:linear-gradient(#8a7a6a,#4a4038)}
.g-well{position:absolute;left:50%;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:50%;background:radial-gradient(circle,#f0d78c,#5a3a10);box-shadow:0 0 12px rgba(201,162,74,.5)}
.g-light{position:absolute;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle,#fff6c8,#e2b657);box-shadow:0 0 10px #e2b657}
.g-ring{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:3px solid var(--gold)}
.g-feather{position:absolute;width:16px;height:54px;background:linear-gradient(#fff8e6,#e8d4a8);border-radius:50% 50% 40% 40%;transform:rotate(-20deg)}
.g-mirror{position:absolute;left:50%;top:50%;width:90px;height:90px;margin:-45px 0 0 -45px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#d0d6e0,#6a7380);border:3px solid var(--gold);opacity:.7;transition:opacity .8s,filter .8s}
.g-mirror.clear{opacity:1;filter:brightness(1.3)}

.folio{
  position:absolute;bottom:.55em;left:0;right:0;text-align:center;
  font-size:.72rem;color:var(--ink-soft);pointer-events:none;letter-spacing:.08em;
  line-height:1;height:1em;
}
.ribbon{
  position:absolute;z-index:7;top:-2px;right:18%;width:14px;height:52px;
  background:linear-gradient(90deg,#7a1f2b,#a83240 50%,#7a1f2b);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 82%,0 100%);
  box-shadow:0 4px 8px rgba(0,0,0,.25);
}

@media (orientation:portrait){
  .scene-read{padding:calc(var(--safe-t) + 4px) 4px calc(var(--safe-b) + 6px)}
  .book-open{
    width:min(96vw, 100%);
    height:min(90vh, calc(96vw * 1.92));
    max-width:none;
  }
  .desk-candle{right:10%;bottom:18px;width:12px;height:32px;opacity:.95;z-index:3}
  .blotter{left:1%;right:1%;top:4%;bottom:4%}
  .leaf-inner:has(.map-wrap){display:flex;flex-direction:column}
  .leaf-inner:has(.map-wrap)>.kicker,
  .leaf-inner:has(.map-wrap)>h2{flex:0 0 auto;margin:.05em 0 .25em}
  .map-wrap{display:flex;flex-direction:column;flex:1 1 auto;min-height:0}
  .map-page{aspect-ratio:auto;flex:1 1 auto;min-height:0;margin-top:2px}
  .welcome-back{font-size:.78rem;line-height:1.35;margin:0 0 .35em;padding:.35em .5em}
  .test-mode{margin:4px auto 0}
  .valley{width:30%;min-width:56px;max-width:72px}
  .valley .vlbl{font-size:.62rem}
  .frame-row.multi{grid-template-columns:1fr 1fr}
  .board-left{width:calc(var(--left-thick) + 10px);left:0}
  .board-right{width:calc(var(--right-thick) + 10px);right:0}
  .spread-wrap{inset:2.5% calc(var(--right-thick) + 8px) 3% calc(var(--left-thick) + 8px)}
  .leaves{flex:1}
  .leaf.single{flex-basis:100%}
  .flipper{width:100%}
  .flipper.forward{right:0;width:100%}
  .flipper.back{left:0;width:100%}
  .leaf h1{font-size:calc(1.45rem * var(--fit, 1))}
  .leaf p{font-size:calc(.98rem * var(--fit, 1))}
}
@media (orientation:landscape) and (max-height:480px){
  .leaf-inner{padding:5% 6% 3%;inset:0 0 1.55em 0}
  .leaf h1{font-size:calc(1.2rem * var(--fit, 1))}
  .leaf h2{font-size:calc(1.05rem * (0.65 + 0.35 * var(--fit, 1)))}
  .leaf p{font-size:calc(.88rem * var(--fit, 1));margin:0 0 calc(.5em * var(--fit, 1));line-height:calc(1.32 + 0.18 * var(--fit, 1))}
  .illu{aspect-ratio:16/6;margin-bottom:6px;max-height:calc(4em + 5em * var(--fit, 1))}
  .verse{font-size:1rem;line-height:2}
  .cover-ui{margin-top:10px}
  .stage3d{height:calc(min(52vh, 36vw) * 1.32);width:min(52vh, 36vw);margin-top:0}
  .drop{font-size:calc(2.4rem * var(--fit, 1));padding:4px 7px}
}
@media (prefers-reduced-motion:reduce){
  .motes,.candle::after,.desk-candle::after,.frame-hit,.valley.appear{animation:none}
  .flipper,.book3d,.cover-hinge,.valley .shot,.map-scenery .layer,.fade-layer{transition:none!important}
}

/* journey extras */
.welcome-back{
  margin:0 0 calc(.55em * var(--fit, 1));padding:calc(.4em * var(--fit, 1)) .6em;border:1px solid rgba(201,162,74,.5);
  background:linear-gradient(180deg,rgba(240,215,140,.28),rgba(243,230,200,.5));
  color:var(--ink);font-size:calc(.92rem * (0.85 + 0.15 * var(--fit, 1)));line-height:1.4;border-radius:3px;
}
.quote-block{margin:.4em 0 1em;padding:0 0 0 .2em}
.quote-block p{font-style:italic;font-size:calc(1.08rem * var(--fit, 1));line-height:calc(1.4 + 0.15 * var(--fit, 1));margin:0 0 calc(.35em * var(--fit, 1))}
.quote-block cite{display:block;font-style:normal;font-size:.72rem;color:var(--ink-soft);letter-spacing:.04em}
.principle .pts{margin:.2em 0 .8em;padding:0 0 0 1.1em}
.pts li{margin:0 0 calc(.25em * var(--fit, 1));line-height:calc(1.32 + 0.13 * var(--fit, 1))}
.letter-from{font-size:.78rem;color:var(--gold-dk);letter-spacing:.06em;margin:0 0 .4em}
.sig-pad{
  display:block;width:100%;height:110px;margin:8px 0;touch-action:none;
  background:linear-gradient(#f7edd4,#efe3c4);border:1px solid var(--gold);
  border-radius:2px;
}
.goal-row{display:flex;gap:8px;margin:8px 0;align-items:center}
.goal-list{list-style:none;margin:0;padding:0}
.goal-list li{display:flex;gap:8px;align-items:baseline;padding:6px 0;border-bottom:1px dotted rgba(201,162,74,.4)}
.goal-list .star{color:var(--gold-dk);min-width:1.4em}
.test-mode{display:block;margin:4px auto 0;font-size:.78rem;color:var(--ink-soft);text-decoration:underline;text-underline-offset:2px}
.ribbon-status{
  position:absolute;z-index:6;left:calc(var(--safe-l) + 10px);top:calc(var(--safe-t) + 12px);
  font-size:.72rem;color:#f0d78c;letter-spacing:.06em;text-shadow:0 1px 2px #1a1008;
  pointer-events:none;
}
.fa-line:empty{display:none}

.map-wrap{position:relative}
.letter-block{margin:.6em 0 .9em;padding-left:.2em;border-left:2px solid rgba(201,162,74,.45)}
.frame-row{margin:calc(6px * var(--fit, 1)) 0 calc(8px * var(--fit, 1))}
.frame-row.multi{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.frame-hit.compact .illu{aspect-ratio:auto;height:calc(1em + 3.2em * var(--fit, 1))}
.frame-hit.compact .cap{font-size:.7rem;padding:3px 6px 5px}
.after-block{margin:calc(.45em * var(--fit, 1)) 0 0;font-size:calc(.92em * (0.82 + 0.18 * var(--fit, 1)));line-height:calc(1.32 + 0.08 * var(--fit, 1))}
.after-block p:last-child{margin-bottom:0}
</style>

(function () {
  var B = window.BOOK;
  if (!B || !B.days) return;

  var days = B.days;
  var kind = B.id || 'journey';
  var ui = window.I18N || {};
  function U(lang, key, fb) {
    var o = (ui[lang] || {})[key];
    return o != null ? o : (fb || key);
  }

  function artForDay(n) {
    var map = B.artByDay || [];
    var i, hit = (B.coverArt || 'cover');
    for (i = 0; i < map.length; i++) if (n >= map[i].from) hit = map[i].art;
    return hit;
  }

  window.BOOK_PAGES = window.BOOK_PAGES || null; // filled below
  window.BOOK_THEME = window.BOOK_THEME || B.themeVars || {};
  window.BOOK_PACE = window.BOOK_PACE || { type: 'calendar', grace: true };
  window.BOOK_INTRO = window.BOOK_INTRO || {
    brand: 'kunskap',
    copyright: '© 2026 SkaparKvarnen (Skaparkvarnen, enskild firma). Alla rättigheter förbehållna.'
  };

  // Map days to engine chapters
  B.chapters = days.map(function (d) {
    return { id: 'd' + d.n, n: d.n, title: d.title, art: artForDay(d.n), finale: d.n === days.length };
  });

  function meta(lang) {
    return {
      title: B.title,
      subtitle: B.subtitle || '',
      kicker: B.kicker || ''
    };
  }
  function chaptersT(lang) {
    var out = {};
    days.forEach(function (d) {
      out['d' + d.n] = {
        title: d.title,
        place: d.place || d.short || d.seal || '',
        retelling: d.chapter || [],
        reflection: (d.reflection && (d.reflection.q || d.reflection)) || ''
      };
    });
    return out;
  }
  function uiBlock(lang) {
    var base = Object.assign({}, ui[lang] || {});
    base.bookTitle = B.bookTitle || base.bookTitle || 'Din bok';
    base.bookSub = B.bookSub || base.bookSub || '';
    base.namePrompt = B.namePrompt || base.firstName || 'Ditt förnamn';
    base.nameHint = B.nameHint || '';
    base.nameGo = base.continue || 'Fortsätt';
    base.dragCover = lang === 'en' ? 'Drag to turn the book. Tap to open it.' : 'Dra för att vända på boken. Tryck för att öppna.';
    base.tocTitle = lang === 'en' ? 'Contents' : 'Innehåll';
    base.tocKicker = lang === 'en' ? 'The first pages' : 'De första sidorna';
    base.mapTitle = lang === 'en' ? 'The path of the journey' : 'Resans väg';
    base.mapKicker = B.kicker || '';
    base.frontisKicker = lang === 'en' ? 'Frontispiece' : 'Försättsblad';
    base.tapFrame = lang === 'en' ? 'Touch the picture' : 'Tryck på bilden';
    base.youAreHere = lang === 'en' ? 'You are here' : 'Här är du';
    base.soundOn = base.soundOn || (lang === 'en' ? 'Turn music off' : 'Stäng av musiken');
    base.soundOff = base.soundOff || (lang === 'en' ? 'Turn music on' : 'Slå på musiken');
    base.restore = base.hasCode || (lang === 'en' ? 'Have a spark code?' : 'Har du en sparkod?');
    base.locked = (B.labels && B.labels.locked) || (lang === 'en' ? 'That chapter is still sealed.' : 'Det kapitlet är fortfarande förseglat.');
    base.langHint = lang === 'en' ? 'Choose a language to begin.' : 'Välj språk för att börja.';
    base.sparkTitle = base.sparkCode || (lang === 'en' ? 'Spark code' : 'Sparkod');
    base.sparkCopy = base.copyCode || (lang === 'en' ? 'Copy the spark code' : 'Kopiera sparkoden');
    base.sparkCopied = base.codeCopied || (lang === 'en' ? 'Copied' : 'Kopierad');
    base.sparkCopyFail = base.copyBlocked || '';
    base.reflection = base.reflection || (lang === 'en' ? 'Your reflection' : 'Din reflektion');
    base.reflectionHint = lang === 'en' ? 'Write freely. No one else will read this.' : 'Skriv fritt. Ingen annan läser detta.';
    base.saveReflection = lang === 'en' ? 'Save in Your book' : 'Spara i Din bok';
    base.skipReflection = lang === 'en' ? 'Skip for now' : 'Hoppa över just nu';
    base.breathTitle = base.breath || (lang === 'en' ? 'Breathing' : 'Andning');
    base.breathIntro = lang === 'en' ? 'Breathe in a steady square: in, hold, out, hold.' : 'Andas i en stadig fyrkant: in, håll, ut, håll.';
    base.continue = base.continue || (lang === 'en' ? 'Continue' : 'Fortsätt');
    base.testMode = lang === 'en' ? 'Test mode: open the next chapter now' : 'Testläge: öppna nästa kapitel nu';
    base.welcomeAway = lang === 'en'
      ? 'Welcome back. Your best streak is {best} {days}. Today a new one can begin — without shame for what was missed.'
      : 'Välkommen tillbaka. Din bästa svit är {best} {days}. I dag kan en ny börja – utan skam för det som missades.';
    return base;
  }

  window.I18N_SV = { meta: meta('sv'), chapters: chaptersT('sv'), ui: uiBlock('sv'), finale: B.finale || null };
  window.I18N_EN = { meta: meta('en'), chapters: chaptersT('en'), ui: uiBlock('en'), finale: B.finale || null };
  if (B.defaultName && typeof B.defaultName === 'string') {
    B.defaultName = { sv: B.defaultName, en: B.defaultName };
  }

  var pages = [];
  var coverArt = B.coverArt || 'cover';
  pages.push({ type: 'frontispiece', id: 'frontis', art: coverArt, interact: { type: 'name', required: false, art: coverArt } });

  // Intro beats are grouped so the opening is two filled pages, not six thin ones.
  var intro = B.intro || [];
  if (intro.length) {
    var mid = Math.ceil(intro.length / 2);
    [intro.slice(0, mid), intro.slice(mid)].forEach(function (chunk, i) {
      if (!chunk.length) return;
      var body = [];
      chunk.forEach(function (p) {
        if (p.t) body.push(p.t);
        if (p.s) body.push(p.s);
      });
      pages.push({
        type: 'text', id: 'intro-' + i, art: coverArt, showArt: i === 0, dropCap: i === 0,
        kicker: B.kicker, title: i === 0 ? B.title : '', heading: i === 0, body: body
      });
    });
  }

  if (B.intentionPrompt) {
    pages.push({
      type: 'text', id: 'intention', art: coverArt, heading: true, title: B.intentionPrompt,
      body: [],
      interact: { type: 'write', art: coverArt, caption: B.intentionPrompt }
    });
  }

  if (B.hasGoals) {
    pages.push({
      type: 'text', id: 'goals', art: coverArt, heading: true, title: 'Drömtavlan',
      body: ['Skriv dina mål. Tryck på stjärnan för att välja ditt huvudmål – det följer dig genom hela resan.'],
      interact: { type: 'goals', required: true, art: coverArt }
    });
  }
  if (B.hasContract) {
    pages.push({
      type: 'text', id: 'contract', art: coverArt, heading: true, title: 'Målkontraktet',
      body: ['När målen är skrivna förseglas de med namn och en underskrift i boken.'],
      interact: { type: 'sign', required: true, art: coverArt }
    });
  }

  pages.push({ type: 'toc', id: 'toc' });
  pages.push({ type: 'map', id: 'map' });

  function pushDay(d) {
    var id = 'd' + d.n;
    var art = artForDay(d.n);
    var skip = {};
    (d.skip || []).forEach(function (k) { skip[k] = true; });

    // One day ≈ one spread: a story page (left) and a practice page (right).
    var storyBody = [];
    if (d.seal && !skip.seal && d.sealHint) storyBody.push(d.sealHint);
    if (d.chapter && !skip.chapter) storyBody = storyBody.concat(d.chapter || []);

    var letters = [];
    if (d.letter) {
      letters.push({
        kind: 'letter',
        from: d.letter.from ? ('Från ' + d.letter.from) : '',
        body: Array.isArray(d.letter.body) ? d.letter.body : [d.letter.body]
      });
    }
    if (d.postcard) {
      letters.push({
        kind: 'postcard',
        from: d.postcard.from ? ('Från ' + d.postcard.from) : '',
        body: Array.isArray(d.postcard.body) ? d.postcard.body : [d.postcard.body]
      });
    }

    pages.push({
      type: 'text', id: id + '-story', chapter: id, art: art,
      showArt: true, dropCap: true,
      kicker: d.seal || d.place || d.short || '',
      title: d.title,
      body: storyBody,
      quote: (!skip.quote && d.quote) ? d.quote : null,
      letters: letters
    });

    var Pr = (!skip.principle && d.principle) ? d.principle : null;
    var interacts = [];
    if (d.puzzle) {
      interacts.push({ type: 'puzzle', required: true, art: art, puzzle: d.puzzle, caption: 'Uppgift' });
    }
    if (d.choice) {
      var opts = (d.choice.options || d.choice.choices || d.choice);
      if (!Array.isArray(opts)) opts = d.choice.options || [];
      interacts.push({
        type: 'choice', required: true, art: art, options: opts,
        title: d.choice.prompt || d.choice.q || 'Ett val',
        hint: d.choice.hint || '',
        caption: d.choice.prompt || 'Ett val'
      });
    }
    if (d.reflection && !skip.reflection) {
      interacts.push({ type: 'write', art: art, caption: 'Din reflektion' });
    }
    var vis = d.visualization || d.breath;
    if (vis && !skip.breath && !skip.visualization) {
      var vbody = [];
      if (vis.intro) vbody.push(vis.intro);
      if (vis.lines) vbody = vbody.concat(vis.lines);
      interacts.push({ type: 'breath', art: art, caption: vis.title || 'Andning', intro: vbody.join(' ') });
    }
    if (d.mission && !skip.mission) {
      interacts.push({ type: 'mission', art: art, mission: d.mission, caption: d.mission.title || 'Dagens uppdrag' });
    }

    var after = [];
    if (d.cliff && !skip.cliff) after = Array.isArray(d.cliff) ? d.cliff.slice() : [d.cliff];
    var mile = null;
    if (B.milestones && B.milestones[d.n]) {
      var M = B.milestones[d.n];
      mile = {
        kicker: M.kicker || M.label || 'Milstolpe',
        title: M.title || 'Milstolpe',
        body: M.lines || M.body || (M.narr ? [M.narr] : []) || []
      };
    }

    pages.push({
      type: 'text', id: id + '-practice', chapter: id, art: art, showArt: false,
      kicker: Pr ? 'Principen' : (d.place || d.short || ''),
      title: Pr ? (Pr.name || 'Principen') : '',
      heading: !!Pr,
      body: Pr && Pr.body ? [Pr.body] : [],
      points: (Pr && Pr.points) || [],
      interacts: interacts,
      after: after,
      afterKicker: d.next || (after.length ? 'Kapitlets slut' : ''),
      milestone: mile
    });
  }

  // Start each day on a left-hand page so one day fills one landscape spread.
  if (pages.length % 2 === 0) {
    pages.push({
      type: 'text', id: 'opening-leaf', art: coverArt, showArt: true, dropCap: false, heading: false,
      kicker: B.kicker || '', title: '', body: [B.subtitle || '']
    });
  }

  days.forEach(pushDay);
  pages.push({ type: 'colophon', id: 'colophon', art: artForDay(days.length) });

  window.BOOK_PAGES = pages;
})();

  function lsGet(k) {
    try { return window.localStorage ? window.localStorage.getItem(k) : null; } catch (e) { return null; }
  }
  function lsSet(k, v) {
    try { if (window.localStorage) window.localStorage.setItem(k, v); } catch (e) {}
  }
  function lsDel(k) {
    try { if (window.localStorage) window.localStorage.removeItem(k); } catch (e) {}
  }
  function prefersReduce() {
    try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); } catch (e) { return false; }
  }
  function shouldSkipIntro() {
    try {
      if (root.__SKIP_STUDIOINTRO) return true;
      var s = String((root.location && location.search) || '') + String((root.location && location.hash) || '');
      if (/(?:[?&#]studiointro=0)(?:&|$)/.test(s) || /(?:[?&#]skipintro=1)(?:&|$)/.test(s)) return true;
    } catch (e) {}
    return false;
  }

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  }

  function buildDom(partners, copyright) {
    var rootEl = el('div');
    rootEl.id = 'si-root';
    rootEl.setAttribute('role', 'dialog');
    rootEl.setAttribute('aria-label', 'Studiointro');
    var style = document.createElement('style');
    style.textContent = cssText();
    var canvas = document.createElement('canvas');
    canvas.id = 'si-fx';
    var stage = el('div', 'si-stage');
    var img = el('img', 'si-logo');
    img.alt = '';
    img.setAttribute('draggable', 'false');
    stage.appendChild(img);
    var legal = el('div', 'si-legal');
    legal.appendChild(el('div', 'si-kicker', 'En produktion av'));
    legal.appendChild(el('div', 'si-studio', 'SkaparKvarnen'));
    legal.appendChild(el('div', 'si-rule'));
    var partWrap = el('div', 'si-partners');
    if (partners && partners.length) {
      partWrap.appendChild(el('div', 'si-kicker', 'I samarbete med'));
      for (var i = 0; i < partners.length; i++) {
        var p = partners[i] || {};
        var row = el('div', 'si-partner', p.name || '');
        var src = p.img || p.image || '';
        if (src && /^(data:|blob:)/i.test(src)) {
          var pi = document.createElement('img');
          pi.alt = p.name || '';
          pi.src = src;
          row.insertBefore(pi, row.firstChild);
        }
        partWrap.appendChild(row);
      }
    }
    legal.appendChild(partWrap);
    legal.appendChild(el('p', 'si-copy', copyright || DEFAULT_COPY));
    var tap = el('div', 'si-tap');
    tap.appendChild(el('div', 'si-kicker', 'SkaparKvarnen'));
    tap.appendChild(el('div', 'si-rule'));
    tap.appendChild(el('div', 'si-tap-text', 'Tryck för att börja'));
    tap.appendChild(el('div', 'si-rule'));
    rootEl.appendChild(style);
    rootEl.appendChild(canvas);
    rootEl.appendChild(stage);
    rootEl.appendChild(legal);
    rootEl.appendChild(tap);
    return { root: rootEl, canvas: canvas, img: img, legal: legal, tap: tap };
  }

  function playChime(ac) {
    if (!ac) return;
    var now = ac.currentTime;
    var master = ac.createGain();
    master.gain.value = 0.22;
    var filter = ac.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 3200;
    filter.Q.value = 0.7;
    var delay = ac.createDelay();
    delay.delayTime.value = 0.22;
    var fb = ac.createGain();
    fb.gain.value = 0.28;
    delay.connect(fb);
    fb.connect(delay);
    filter.connect(master);
    master.connect(delay);
    master.connect(ac.destination);
    delay.connect(ac.destination);
    var notes = [
      { f: 523.25, t: 0.00, d: 1.8, v: 0.9, typ: 'sine' },
      { f: 659.25, t: 0.08, d: 1.8, v: 0.75, typ: 'triangle' },
      { f: 783.99, t: 0.16, d: 1.9, v: 0.7, typ: 'sine' },
      { f: 1046.50, t: 0.28, d: 2.1, v: 0.55, typ: 'sine' },
      { f: 1318.51, t: 0.40, d: 2.0, v: 0.32, typ: 'triangle' },
      { f: 261.63, t: 0.00, d: 2.4, v: 0.22, typ: 'sine' }
    ];
    for (var i = 0; i < notes.length; i++) {
      var n = notes[i];
      var osc = ac.createOscillator();
      var g = ac.createGain();
      osc.type = n.typ;
      osc.frequency.value = n.f;
      var t0 = now + n.t;
      g.gain.setValueAtTime(0, t0);
      g.gain.linearRampToValueAtTime(n.v, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0008, t0 + n.d);
      osc.connect(g);
      g.connect(filter);
      osc.start(t0);
      osc.stop(t0 + n.d + 0.05);
    }
  }

  function makeParticles(n) {
    var a = [];
    for (var i = 0; i < n; i++) a.push(resetP({}, true));
    return a;
  }
  function resetP(p, scatter) {
    var ang = Math.random() * Math.PI * 2;
    var rad = 0.04 + Math.random() * 0.28;
    p.x = 0.5 + Math.cos(ang) * rad * 0.85;
    p.y = 0.38 + Math.sin(ang) * rad * 0.7;
    p.vx = (Math.random() - 0.5) * 0.04;
    p.vy = -0.03 - Math.random() * 0.08;
    p.life = scatter ? Math.random() : 0;
    p.max = 0.9 + Math.random() * 1.4;
    p.size = 0.6 + Math.random() * 2.2;
    p.tw = Math.random() * 6;
    p.gold = Math.random() < 0.75;
    return p;
  }

  function sizeCanvas(s) {
    var r = s.root.getBoundingClientRect();
    var dpr = Math.min(window.devicePixelRatio || 1, 2);

        if (!window.Journey) return false;
        var ok = Journey.forceUnlock(S, (cfg.book.days && cfg.book.days.length) || (cfg.book.chapters && cfg.book.chapters.length) || 30);
        if (ok) { capToUnlocked(); save(); expose(); }
        return ok;
      },
      setToday: function (iso) { if (window.Journey) Journey.now = iso; },
      curlProgress: 0,
      fitLeaves: fitVisibleLeaves
    };
  }

  function valleyState() {
    var out = {};
    (cfg.valleys || []).forEach(function (v) {
      var done = v.chapters.some(function (id) { return dayRec(id) && dayRec(id).done; });
      var started = v.chapters.some(function (id) {
        var ch = chapterById(id);
        return ch && ch.n <= S.unlocked;
      });
      var current = v.chapters.some(function (id) {
        var ch = chapterById(id);
        return ch && ch.n === S.unlocked && !(dayRec(id) && dayRec(id).done);
      });
      out[v.id] = { unlocked: done, sketched: !done, current: current || (started && !done && v.id === currentValleyId()), started: started };
    });
    return out;
  }
  function currentValleyId() {
    var ch = (cfg.book.chapters || []).filter(function (c) { return c.n === S.unlocked; })[0];
    if (!ch) return (cfg.valleys[cfg.valleys.length - 1] || {}).id;
    var hit = (cfg.valleys || []).filter(function (v) { return v.chapters.indexOf(ch.id) >= 0; })[0];
    return hit ? hit.id : cfg.valleys[0].id;
  }
  function chapterById(id) {
    var list = cfg.book.chapters || [];
    var hit = list.filter(function (c) { return c.id === id || c.id === ('d' + id) || ('d' + c.n) === String(id); })[0];
    return hit;
  }
  function dayNum(id) {
    if (typeof id === 'number') return id;
    var m = String(id || '').match(/^d?(\d+)$/);
    if (m) return +m[1];
    var ch = chapterById(id);
    return ch ? ch.n : null;
  }
  function dayRec(id) {
    var n = dayNum(id);
    return S.days[id] || (n != null && (S.days[n] || S.days['d' + n])) || null;
  }

  function firstPageOf(chapterId) {
    for (var i = 0; i < pages.length; i++) if (pages[i].chapter === chapterId) return i;
    return -1;
  }
  function lastPageOf(chapterId) {
    var last = -1;
    for (var i = 0; i < pages.length; i++) if (pages[i].chapter === chapterId) last = i;
    return last;
  }
  function findPageWith(kind) {
    for (var i = 0; i < pages.length; i++) {
      var list = pageInteracts(pages[i]);
      for (var j = 0; j < list.length; j++) if (list[j].type === kind) return pages[i];
    }
    return null;
  }

  /* ---------- cover scene ---------- */
  function motes() {
    var s = '';
    for (var i = 0; i < 14; i++) {
      s += '<i style="left:' + (5 + Math.random() * 90) + '%;top:' + (40 + Math.random() * 50) + '%;animation-duration:' + (8 + Math.random() * 8) + 's;animation-delay:-' + (Math.random() * 9) + 's"></i>';
    }
    return s;
  }
  function applyTheme() {
    var th = cfg.theme || (cfg.book && cfg.book.theme) || {};
    var root = document.documentElement;
    Object.keys(th).forEach(function (k) {
      if (k.charAt(0) === '-') root.style.setProperty(k, th[k]);
    });
    if (th.leather) root.style.setProperty('--leather', th.leather);
    if (th.paper) root.style.setProperty('--paper', th.paper);
    if (th.gold) root.style.setProperty('--gold', th.gold);
    if (th.display) root.style.setProperty('--display', th.display);
    if (th.night) root.style.setProperty('--night', th.night);
  }

  function renderCover() {
    phase = 'cover';

    });

      b.addEventListener('click', function () {

        document.querySelector('#chint').textContent = t('dragCover');
        var h = app.querySelector('.cover-title h1'); if (h) h.textContent = T.meta.title;
        var sp = app.querySelector('.spine-title'); if (sp) sp.textContent = T.meta.title;
        var rs = document.getElementById('restore'); if (rs) rs.textContent = t('restore');
      });

  function pulseHint(msg) {
    var h = document.getElementById('chint');
    if (h) h.textContent = msg;
  }

  function requestOpen() {
    if (!S.lang) { setLang('sv'); }
    S.started = true; save();
    wakeSound();
    CoverView.animateOpen(function () {
      CoverView.destroy();
      renderRead();
    });
  }

  function openRestore(fromCover) {
    Panels.mount(ensureOverlay());
    ensureOverlay().hidden = false;
    Panels.open({
      type: 'spark',
      title: t('restoreTitle'),
      hint: t('restoreHint'),
      restoreLabel: t('restoreOk'),
      closeLabel: t('back')
    }, function (res) {
      if (!res || !res.code) return;
      var obj = decodeCode(res.code);
      if (!obj || !obj.s) { toast(t('restoreErr')); return; }
      S = Object.assign(fresh(), obj.s);
      S.started = true;
      setLang(S.lang || 'sv');
      pageIndex = Math.min(S.page || 0, pages.length - 1);
      maxPage = Math.max(S.maxPage || 0, pageIndex, frontMatterEnd());
      save(); wakeSound();
      if (phase === 'cover') requestOpen();
      else goToPage(pageIndex, true);
    });
  }

  function frontMatterEnd() {
    // All pages before the first numbered chapter belong to the opening.
    var last = 0;
    for (var i = 0; i < pages.length; i++) {
      var p = pages[i];
      var isFront = p.type === 'frontispiece' || p.type === 'toc' || p.type === 'map' || !p.chapter;
      if (isFront) last = i;
      else break;
    }
    return last;
  }

  /* ---------- reading scene ---------- */
  function ensureOverlay() {
    var o = document.getElementById('overlay-host');
    if (!o) {
      o = document.createElement('div'); o.id = 'overlay-host'; o.hidden = true;
      app.appendChild(o);
    }
    return o;
  }

  function renderRead() {
    phase = 'open';
    applyTheme();
    if (window.Journey && cfg.pace) {
      Journey.checkStreak(S);
      Journey.refreshUnlock(S, (cfg.book.days && cfg.book.days.length) || (cfg.book.chapters && cfg.book.chapters.length) || 30);
      save();
    }
    var status = '';
    if (S.streak || S.best) {
      status = '<div class="ribbon-status">' + (S.away && S.best ? ('Bäst ' + S.best) : ((S.streak || 0) + ' i rad')) + '</div>';
    }
    app.innerHTML = '<div class="scene-read" data-phase="open">' +
      '<div class="desk" aria-hidden="true"><div class="desk-glow"></div><div class="blotter"></div><div class="desk-candle"></div></div>' +
      status +
      '<button type="button" class="sound" id="sound">♪</button>' +
      '<div class="book-open" id="book-open"></div>' +
      '<div id="overlay-host" hidden></div></div>';
    bindSound(document.getElementById('sound'));
    Panels.mount(document.getElementById('overlay-host'));
    Tex.apply();
    PagesView.mount(document.getElementById('book-open'), {
      pages: pages,
      index: pageIndex,
      renderPage: renderPage,
      onTurn: function (d) {
        var n = PagesView.nextIndex(pageIndex, d);
        n = Math.max(0, Math.min(maxPage, n, pages.length - 1));
        goToPage(n, true);
      }
    });
    markChapters(pageIndex);
    expose();
    window.__book.leftThickness = PagesView.thickness(pageIndex).left;
    window.__book.rightThickness = PagesView.thickness(pageIndex).right;
    if (Music.setMode) Music.setMode('read');
  }

  function goToPage(idx, already) {
    idx = Math.max(0, Math.min(pages.length - 1, idx));
    if (idx > maxPage) idx = maxPage;
    pageIndex = idx;
    S.page = idx;
    if (idx > (S.maxPage || 0)) S.maxPage = idx;
    save();
    if (phase !== 'open') { renderRead(); return; }
    if (!already) PagesView.refresh(idx);
    else PagesView.refresh(idx);
    markChapters(idx);
    expose();
    var th = PagesView.thickness(idx);
    window.__book.leftThickness = th.left;
    window.__book.rightThickness = th.right;
    window.__book.pageIndex = pageIndex;
    window.__book.maxPage = maxPage;
  }

  function lastPageOfUnlocked() {
    var ch = (cfg.book.chapters || []).filter(function (c) { return c.n === S.unlocked; })[0];
    if (!ch) return pages.length - 1;
    var last = lastPageOf(ch.id);
    return last >= 0 ? last : pages.length - 1;
  }
  function capToUnlocked() {
    var cap = Math.max(frontMatterEnd(), lastPageOfUnlocked());
    // already finished days stay open for rereading
    (cfg.book.chapters || []).forEach(function (ch) {
      if (dayRec(ch.id) && dayRec(ch.id).done) cap = Math.max(cap, lastPageOf(ch.id));
    });
    // if current unlocked day is done but next not yet opened (waiting for midnight), stay on this day
    maxPage = Math.max(maxPage, Math.min(pages.length - 1, cap));
  }
  function markChapters(idx) {
    maxPage = Math.max(maxPage, frontMatterEnd());
    var p = pages[idx];
    if (!p) return;
    if (p.interact && p.interact.required && !interactDone(p)) {
      maxPage = Math.max(maxPage, idx);
    } else {
      maxPage = Math.max(maxPage, Math.min(pages.length - 1, idx + 1));
    }
    (cfg.book.chapters || []).forEach(function (ch) {
      var last = lastPageOf(ch.id);
      if (last >= 0 && idx >= last) {
        if (cfg.pace && window.Journey) {
          Journey.completeDay(S, ch.n);
          if (!S.days[ch.id]) S.days[ch.id] = S.days[ch.n] || {};
          S.days[ch.id].done = true;
          // Nästa kapitel låses upp vid midnatt, inte med en gång
          Journey.refreshUnlock(S, cfg.book.chapters.length);
        } else {
          if (!S.days[ch.id]) S.days[ch.id] = {};
          S.days[ch.id].done = true;
          if (S.unlocked < ch.n + 1) S.unlocked = Math.min(ch.n + 1, cfg.book.chapters.length);
          if (ch.finale) S.unlocked = cfg.book.chapters.length;
        }
      }
    });
    if (cfg.pace) capToUnlocked();
    S.maxPage = maxPage;
    save();
  }

  function pageInteracts(p) {
    if (p.interacts && p.interacts.length) return p.interacts;
    return p.interact ? [p.interact] : [];
  }
  function oneInteractDone(p, it) {
    if (!it) return true;
    if (it.type === 'choice') {
      if (it.kind === 'bird' || (!it.options && (cfg.book.birds || []).length)) return !!S.bird;
      var key = dayNum(p.chapter);
      return !!(S.choices && (S.choices[key] || S.choices[p.chapter]));
    }
    if (it.type === 'name') return !!S.name;
    if (it.type === 'sign') return !!(S.contract && S.contract.name);
    if (it.type === 'goals') return !!(S.goals && S.goals.length);
    if (it.type === 'mission') return !!(S.missions && (S.missions[dayNum(p.chapter)] || S.missions[p.chapter]));
    if (it.type === 'write') return true;
    if (it.type === 'breath') return true;
    if (it.type === 'puzzle') return !!(dayRec(p.chapter) && dayRec(p.chapter).puzzle);
    if (it.type === 'gesture') return !!(p.chapter && S.gestures[p.chapter]);
    return true;
  }
  function interactDone(p) {
    var list = pageInteracts(p);
    if (!list.length) return true;
    for (var i = 0; i < list.length; i++) {
      if (list[i].required && !oneInteractDone(p, list[i])) return false;
    }
    return true;
  }

  /* ---------- page rendering ---------- */
  function artUrl(name) {
    if (name === 'land-unity') name = 'land-qaf';
    return 'var(--art-' + name + ')';
  }
  function illu(art, cls) {
    if (!art) return '';
    var pos = (art === 'cover') ? ';background-position:var(--cover-pos, center)' : '';
    return '<div class="illu ' + (cls || '') + '" style="background-image:' + artUrl(art) + pos + '"></div>';
  }


  function fits(inner) {
    return inner.scrollHeight <= inner.clientHeight;
  }
  function searchFit(inner, min) {
    if (fits(inner)) return true;
    var lo = min, hi = 1, best = 0, i, mid;
    for (i = 0; i < 11; i++) {
      mid = (lo + hi) / 2;
      inner.style.setProperty('--fit', mid.toFixed(3));
      if (fits(inner)) { best = mid; lo = mid; }
      else hi = mid;
    }
    if (best) {
      inner.style.setProperty('--fit', best.toFixed(3));
      return true;
    }
    inner.style.setProperty('--fit', min.toFixed(2));
    return fits(inner);
  }
  function fitLeaf(inner) {
    if (!inner || !inner.clientHeight) return;
    inner.classList.remove('fit-tight');
    inner.style.overflowY = 'hidden';
    inner.style.setProperty('--fit', '1');
    if (inner.querySelector('.map-wrap')) {
      if (fits(inner)) return;
      inner.classList.add('fit-tight');
      if (fits(inner)) return;
      var k;
      for (k = 96; k >= 64; k -= 4) {
        inner.style.setProperty('--fit', (k / 100).toFixed(2));
        if (fits(inner)) return;
      }
      return;
    }
    if (fits(inner)) return;
    if (searchFit(inner, 0.70)) return;
    inner.classList.add('fit-tight');
    inner.style.setProperty('--fit', '1');
    if (fits(inner)) return;
    if (searchFit(inner, 0.50)) return;
    if (inner.querySelector('.colophon')) inner.style.overflowY = 'auto';
  }
  function fitVisibleLeaves() {
    var nodes = document.querySelectorAll('.leaf .leaf-inner');
    for (var i = 0; i < nodes.length; i++) fitLeaf(nodes[i]);
  }
  function scheduleFit(inner) {
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        if (inner && inner.isConnected) fitLeaf(inner);
        else fitVisibleLeaves();
      });
    });
  }

  function renderPage(inner, page, idx) {
    if (!page) { inner.innerHTML = ''; return; }
    var html = '';
    if (page.type === 'frontispiece') {
      html = '<div class="frontis"><span class="kicker">' + esc(t('frontisKicker')) + '</span>' +
        '<div class="fa-line">' + esc((cfg.cover && cfg.cover.persianTitle) || '') + '</div>' +
        '<h1>' + esc(T.meta.title) + '</h1><hr class="rule">' +
        '<p class="muted">' + esc(T.meta.subtitle) + '</p>' +
        '<p class="muted">' + esc(T.meta.kicker) + '</p>' +
        '<div class="guide-row">' + spr('hoopoe') + '</div>' +
        frameBtn(page, t('namePrompt')) +
        '</div>';
    } else if (page.type === 'toc') {
      html = '<span class="kicker">' + esc(t('tocKicker')) + '</span><h2>' + esc(t('tocTitle')) + '</h2><ol class="toc-list">';
      (cfg.book.chapters || []).forEach(function (ch) {
        var C = T.chapters[ch.id];
        var dest = firstPageOf(ch.id);
        var locked = dest > maxPage && ch.n > S.unlocked;
        html += '<li><button type="button" data-go="' + dest + '"' + (locked ? ' disabled' : '') + '>' +
          '<span class="num">' + ch.n + '</span><span class="ttl">' + esc(C.title) + '</span>' +
          '<span class="pg">' + (dest + 1) + '</span></button></li>';
      });
      html += '</ol>';
    } else if (page.type === 'map') {
      html = '<span class="kicker">' + esc(t('mapKicker')) + '</span><h2>' + esc(t('mapTitle')) + '</h2>' + renderMap();
    } else if (page.type === 'verse') {
      var C = T.chapters[page.chapter] || {};
      var vkey = page.verseKey;
      if (page.dynamicVerse || page.blowText === 'excuse') vkey = S.bird;
      if (page.blowText === 'excuse' && S.bird && T.birds[S.bird]) {
        html = '<div class="frontis">' + spr(S.bird) + '<span class="kicker">' + esc(birdName()) + '</span><h2>' + esc(birdName()) + '</h2></div>';
      } else {
        html = '<span class="kicker">' + esc(C.place || '') + '</span><h2>' + esc(C.title || '') + '</h2>';
      }
      html += '<div class="verse-box" id="vbox-' + idx + '">' + verseHtml(vkey) + '<canvas class="blow-canvas" hidden></canvas></div>';
      if (page.sourceHidden) {}
      html += '<button type="button" class="seal" data-blow="' + idx + '">' + esc(t('blow')) + '</button>';
    } else if (page.type === 'text') {
      var C2 = page.chapter ? (T.chapters[page.chapter] || {}) : {};
      if (page.showArt) html += illu(page.art);
      if (page.kicker || C2.place) html += '<span class="kicker">' + esc(page.kicker || C2.place) + '</span>';
      if (page.heading !== false) html += '<h2>' + esc(interp(page.title || C2.title || '')) + '</h2>';
      var paras = bodyParas(page);
      if (!paras.length && page.interact) {
        if (page.interact.type === 'choice') {
          html += '<h2>' + esc(t('chooseBird')) + '</h2><p>' + esc(t('chooseBirdHint')) + '</p>';
        } else if (page.interact.type === 'write') {
          html += '<h2>' + esc(t('reflection')) + '</h2><p>' + esc(C2.reflection || '') + '</p>';
        } else if (page.interact.type === 'gesture') {
          var gk = 'gesture' + page.interact.gesture.charAt(0).toUpperCase() + page.interact.gesture.slice(1);
          html += '<p>' + esc(t(gk)) + '</p>';
        } else if (page.interact.type === 'breath') {
          html += '<h2>' + esc(t('breathTitle')) + '</h2><p>' + esc(t('breathIntro')) + '</p>';
        }
      }
      if (page.from) html += '<p class="letter-from">' + esc(interp(page.from)) + '</p>';
      paras.forEach(function (p, i) {
        if (i === 0 && page.dropCap && p) {
          var ch0 = p.charAt(0), rest = p.slice(1);
          html += '<p><span class="drop">' + esc(ch0) + '</span>' + esc(rest) + '</p>';
        } else html += '<p>' + esc(p) + '</p>';
      });
      if (page.quote) {
        html += '<blockquote class="quote-block"><p>”' + esc(interp(page.quote.text || page.quote)) + '”</p>';
        if (page.quote.src) html += '<cite>' + esc(page.quote.src) + '</cite>';
        html += '</blockquote>';
      }
      if (page.points && page.points.length) {
        html += '<ul class="pts">';
        page.points.forEach(function (pt) { html += '<li>' + esc(interp(pt)) + '</li>'; });
        html += '</ul>';
      }
      (page.letters || []).forEach(function (L) {
        html += '<div class="letter-block">';
        if (L.from) html += '<p class="letter-from">' + esc(interp(L.from)) + '</p>';
        (L.body || []).forEach(function (para) { html += '<p>' + esc(interp(para)) + '</p>'; });
        html += '</div>';
      });
      var acts = page.interacts || (page.interact ? [page.interact] : []);
      if (acts.length) {
        html += '<div class="frame-row' + (acts.length > 1 ? ' multi' : '') + '">';
        acts.forEach(function (it, i) { html += frameBtn(page, it.caption, it, i); });
        html += '</div>';
      }
      if (page.after && page.after.length) {
        html += '<div class="after-block">';
        if (page.afterKicker) html += '<span class="kicker">' + esc(page.afterKicker) + '</span>';
        page.after.forEach(function (para) { html += '<p>' + esc(interp(para)) + '</p>'; });
        html += '</div>';
      }
      if (page.milestone) {
        var M = page.milestone;
        html += '<div class="milestone-block">';
        if (M.kicker) html += '<span class="kicker">' + esc(M.kicker) + '</span>';
        if (M.title) html += '<p class="mile-title">' + esc(M.title) + '</p>';
        if (M.body && M.body[0]) html += '<p>' + esc(interp(M.body[0])) + '</p>';
        if (M.body && M.body.length > 1) {
          html += '<button type="button" class="mile-more" data-milestone="1">Läs hela milstolpen</button>';
        }
        html += '</div>';
      }
    } else if (page.type === 'colophon') {
      html = renderColophon();
    }
    inner.innerHTML = html;
    bindPage(inner, page, idx);
    scheduleFit(inner);
  }

  function bodyParas(page) {
    var C = page.chapter ? (T.chapters[page.chapter] || {}) : {};
    var after = '';
    if (C.after && S.bird && C.after[S.bird]) after = C.after[S.bird];
    var src = page.body || C.retelling || [];
    if (typeof src === 'string') src = [src];
    var out = [];
    src.forEach(function (p) {
      var text = interp(p, after).trim();

  function renderMap() {
    var vs = cfg.valleys || [];
    var st = valleyState();
    var pathD = '';
    vs.forEach(function (v, i) {
      var x = v.x, y = v.y;
      if (i === 0) pathD += 'M ' + x + ' ' + y;
      else {
        var p = vs[i - 1];
        pathD += ' Q ' + ((p.x + x) / 2) + ' ' + ((p.y + y) / 2 - 6) + ' ' + x + ' ' + y;
      }
    });
    var seen = {};
    var layers = '';
    vs.forEach(function (v, i) {
      var art = v.art === 'land-unity' ? 'land-qaf' : v.art;
      if (!art || seen[art + (v.artPos || '')]) return;
      seen[art + (v.artPos || '')] = 1;
      var s = st[v.id] || {};
      var on = s.unlocked || s.current || s.started;
      var cls = 'layer' + (on ? ' on' : '') + (s.current ? ' current' : '');
      var pos = v.artPos ? 'background-position:' + v.artPos + ';' : '';
      layers += '<div class="' + cls + '" style="background-image:var(--art-' + art + ');' + pos + 'transition-delay:' + (i * 0.08) + 's"></div>';
    });
    var nodes = '';
    vs.forEach(function (v, i) {
      var s = st[v.id] || {};
      var cls = 'valley appear' + (s.unlocked ? ' unlocked' : ' sketched') + (s.current ? ' current' : '');
      var label = (cfg.uiExtra && cfg.uiExtra[lang] && cfg.uiExtra[lang].valley && cfg.uiExtra[lang].valley[v.id]) || v.label || v.id;
      var art = v.art === 'land-unity' ? 'land-qaf' : v.art;
      var pos = v.artPos ? '--pos:' + v.artPos + ';' : '';
      var tint = v.tint ? '--tint:' + v.tint + ';' : '';
      nodes += '<button type="button" class="' + cls + '" data-valley="' + v.id + '" style="left:' + v.x + '%;top:' + v.y + '%;animation-delay:' + (0.12 + i * 0.07) + 's;' + pos + tint + '">' +
        (s.current ? '<span class="you-are">' + esc(t('youAreHere')) + '</span>' : '') +
        '<span class="shot" style="background-image:var(--art-' + art + ');' + pos + '"></span>' +
        '<span class="vlbl">' + esc(label) + '</span></button>';
    });
    var welcome = '';
    if (window.Journey && S.away) {
      welcome = '<div class="welcome-back">' + esc(Journey.welcome(S, t)) + '</div>';
    }
    var testBtn = '';
    if (cfg.pace && cfg.testMode !== false) {
      testBtn = '<button type="button" class="test-mode" data-force-unlock="1">' + esc(t('testMode') === 'testMode' ? 'Testläge: öppna nästa kapitel nu' : t('testMode')) + '</button>';
    }
    return '<div class="map-wrap">' + welcome + '<div class="map-page"><div class="map-scenery">' + layers + '<div class="map-veil"></div></div><svg class="map-path" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="' + pathD + '" fill="none" stroke="#c9a24a" stroke-width="0.6" opacity="0.85"/></svg>' + nodes + '</div>' + testBtn + '</div>';
  }

  function artCssUrl(name) {
    if (name === 'land-unity') name = 'land-qaf';
    // read computed CSS variable --art-name which is url(data:...)
    try {
      var v = getComputedStyle(document.documentElement).getPropertyValue('--art-' + name).trim();
      // v is url("data:...") or url(data:...)
      var m = v.match(/^url\((["']?)(.+)\1\)$/);
      return m ? m[2] : '';
    } catch (e) { return ''; }
  }

  function renderColophon() {
    var html = '<div class="colophon"><span class="kicker">' + esc(t('bookTitle')) + '</span><h2>' + esc(t('bookTitle')) + '</h2>';

    html += '<p class="src">Attar, Mantiq al-tayr. Ganjoor, public domain.</p></div>';
