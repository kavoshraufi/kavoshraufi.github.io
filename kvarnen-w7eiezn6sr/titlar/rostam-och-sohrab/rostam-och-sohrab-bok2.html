  function bindPage(inner, page, idx) {
    Array.prototype.forEach.call(inner.querySelectorAll('.valley[data-valley]'), function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var id = b.getAttribute('data-valley');
        var v = (cfg.valleys || []).filter(function (x) { return x.id === id; })[0];
        if (!v) return;
        var dest = -1;
        for (var i = 0; i < v.chapters.length; i++) {
          var d = firstPageOf(v.chapters[i]);
          var ch = chapterById(v.chapters[i]);
          if (d >= 0 && ch && ch.n <= S.unlocked) { dest = d; break; }
        }
        if (dest < 0) { toast(t('locked')); return; }
        maxPage = Math.max(maxPage, dest);
        goToPage(dest);
      });
    });
    var fu = inner.querySelector('[data-force-unlock]');
    if (fu) fu.addEventListener('click', function (e) {
      e.stopPropagation();
      if (window.Journey && Journey.forceUnlock(S, (cfg.book.days && cfg.book.days.length) || (cfg.book.chapters && cfg.book.chapters.length) || 30)) {
        capToUnlocked();
        save(); expose();
        toast(t('testUnlocked') === 'testUnlocked' ? 'Nästa kapitel är öppet.' : t('testUnlocked'));
        PagesView.refresh(pageIndex);
      } else {
        toast(t('testLocked') === 'testLocked' ? 'Avsluta kapitlet först.' : t('testLocked'));
      }
    });
    var mileBtn = inner.querySelector('[data-milestone]');
    if (mileBtn) mileBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      var M = page.milestone || {};
      var body = (M.body || []).map(function (para) { return '<p>' + esc(interp(para)) + '</p>'; }).join('');
      Panels.open({ type: 'info', title: M.title || M.kicker || 'Milstolpe', body: body, closeLabel: 'Stäng' }, function () {});
    });
    var bookBtn = inner.querySelector('[data-open-book]');
    if (bookBtn) bookBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      var refs = Object.keys(S.reflections).filter(function (k) { return S.reflections[k]; });
      var body = refs.map(function (k) {
        var title = (T.chapters[k] && T.chapters[k].title) || k;
        return '<p><small class="kicker">' + esc(title) + '</small><br>' + esc(S.reflections[k]) + '</p>';
      }).join('');
      Panels.open({ type: 'info', title: t('bookTitle'), body: body, closeLabel: 'Stäng' }, function () {});
    });
    var finBtn = inner.querySelector('[data-open-finale]');
    if (finBtn) finBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      var fl = (T.finale && T.finale.lines) || [];
      var body = fl.map(function (para) { return '<p>' + esc(interp(para)) + '</p>'; }).join('');
      Panels.open({ type: 'info', title: (T.finale && T.finale.title) || '', body: body, closeLabel: 'Stäng' }, function () {});
    });
    Array.prototype.forEach.call(inner.querySelectorAll('.toc-list [data-go]'), function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var dest = +b.getAttribute('data-go');
        if (dest > maxPage && dest > frontMatterEnd()) {
          var chOk = false;
          var ch = (cfg.book.chapters || []).filter(function (c) { return firstPageOf(c.id) === dest; })[0];
          if (ch && ch.n <= S.unlocked) {
            maxPage = Math.max(maxPage, dest);
            chOk = true;
          }
          if (!chOk) { toast(t('locked')); return; }
        }
        goToPage(dest);
      });
    });
    var blow = inner.querySelector('[data-blow]');
    if (blow) {
      blow.addEventListener('click', function (e) {
        e.stopPropagation();
        blow.disabled = true; blow.hidden = true;
        var box = inner.querySelector('.verse-box');
        var verseEl = inner.querySelector('.verse');
        var dest = '';
        if (page.blowText === 'excuse' && S.bird && T.birds[S.bird]) dest = T.birds[S.bird].excuse;
        else dest = bodyParas({ chapter: page.chapter, body: page.blowBody }).join('\n\n');
        if (Music.setMode) Music.setMode('verse');
        Blow.run(box, verseEl, dest, function () {
          // keep translation by swapping verse for trans text
          var trans = document.createElement('div');
          dest.split(/\n+/).forEach(function (p) {
            if (!p.trim()) return;
            var el = document.createElement('p'); el.textContent = p.trim(); trans.appendChild(el);
          });
          if (verseEl && verseEl.parentNode) verseEl.parentNode.insertBefore(trans, verseEl);
          maxPage = Math.max(maxPage, Math.min(pages.length - 1, idx + 1));
          S.maxPage = maxPage; save();
          expose();
        });
      });
    }
    Array.prototype.forEach.call(inner.querySelectorAll('[data-interact]'), function (frame) {
      frame.addEventListener('click', function (e) {
        e.stopPropagation();
        var kind = frame.getAttribute('data-interact');
        if (kind === 'spark' || (page.interact && page.interact.type === 'spark') || page.type === 'colophon') {
          openSparkExport();
          return;
        }
        var list = pageInteracts(page);
        var i = +frame.getAttribute('data-i');
        var it = list[i] || list[0] || page.interact;
        openInteract(page, it);
      });
    });
  }

  function openSparkExport() {
    Panels.open({
      type: 'spark',
      title: t('sparkTitle'),
      hint: t('sparkHint'),
      value: encodeCode({ s: S }),
      copyLabel: t('sparkCopy'),
      restoreLabel: t('restoreOk'),
      closeLabel: t('back')
    }, function (res) {
      if (!res) return;
      if (res.copied) toast(res.copied === true ? t('sparkCopied') : t('sparkCopyFail'));
      if (res.code) {
        var obj = decodeCode(res.code);
        if (!obj || !obj.s) { toast(t('restoreErr')); return; }
        S = Object.assign(fresh(), obj.s);
        setLang(S.lang || 'sv');
        pageIndex = Math.min(S.page || 0, pages.length - 1);
        maxPage = Math.max(S.maxPage || frontMatterEnd(), pageIndex);
        save(); goToPage(pageIndex);
      }
    });
  }

  function openInteract(page, it) {
    if (!page) return;
    if (!it) {
      var list0 = pageInteracts(page);
      it = list0[0] || page.interact;
    }
    if (!it) return;
    var spec = { type: it.type, closeLabel: t('back') };
    if (it.type === 'write') {
      var C = T.chapters[page.chapter] || {};
      spec.title = page.id === 'intention' ? (t('myIntention') === 'myIntention' ? 'Min avsikt' : t('myIntention')) : t('reflection');
      spec.prompt = page.id === 'intention' ? (cfg.book && cfg.book.intentionPrompt) || '' : (C.reflection || '');
      spec.hint = t('reflectionHint');
      spec.value = S.reflections[page.chapter] || '';
      spec.saveLabel = t('saveReflection');
      spec.skipLabel = t('skipReflection');
    } else if (it.type === 'name') {
      spec.title = t('namePrompt');
      spec.hint = t('nameHint');
      spec.kicker = T.meta.kicker;
      spec.value = S.name || '';
      spec.saveLabel = t('nameGo');
    } else if (it.type === 'choice') {
      if (it.options && it.options.length) {
        spec.title = it.title || t('choice') || t('chooseBird');
        spec.hint = it.hint || '';
        spec.options = it.options.map(function (o) {
          return { id: o.id, name: o.label || o.name, body: interp(o.body || o.excuse || ''), label: o.label || o.name };
        });
      } else {
        spec.title = t('chooseBird');
        spec.hint = t('chooseBirdHint');
        spec.birds = (cfg.book.birds || []).map(function (b) {
          var info = T.birds[b.id];
          return { id: b.id, name: info.name, excuse: info.excuse, spr: spr(b.id, 'sm') };
        });
      }
    } else if (it.type === 'mission') {
      var Md = it.mission || {};
      spec.title = Md.title || t('mission');
      spec.body = interp(Md.body || '');
      spec.acceptLabel = t('acceptMission') === 'acceptMission' ? 'Jag antar uppdraget' : t('acceptMission');
    } else if (it.type === 'sign') {
      var in90 = new Date(); in90.setDate(in90.getDate() + 90);
      function iso(d) { return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
      var main = (S.goals || []).filter(function (g) { return g.id === S.mainGoal; })[0];
      spec.title = t('contract') === 'contract' ? 'Målkontraktet' : t('contract');
      spec.hint = t('contractHint') === 'contractHint' ? 'Skriv under med fingret.' : t('contractHint');
      spec.name = (S.contract && S.contract.name) || S.name || '';
      spec.goal = (S.contract && S.contract.goal) || (main && main.text) || '';
      spec.give = (S.contract && S.contract.give) || '';
      spec.date = (S.contract && (S.contract.dateIso || S.contract.date)) || iso(in90);
      spec.pledge = t('contractPledge') === 'contractPledge' ? 'Jag läser ett kapitel om dagen, läser mitt mål morgon och kväll och ger aldrig upp förrän det är mitt.' : t('contractPledge');
      spec.signLabel = t('signSeal') === 'signSeal' ? 'Skriv under och försegla' : t('signSeal');
    } else if (it.type === 'goals') {
      spec.title = t('goals') === 'goals' ? 'Dina mål' : t('goals');
      spec.hint = t('goalsHint') === 'goalsHint' ? 'Skriv dina mål. Tryck på stjärnan för att välja ditt huvudmål.' : t('goalsHint');
      spec.placeholder = t('goalPlaceholder') === 'goalPlaceholder' ? 'Jag vill …' : t('goalPlaceholder');
      spec.addLabel = t('addGoal') === 'addGoal' ? 'Lägg till' : t('addGoal');
      spec.continueLabel = t('continue') === 'continue' ? 'Fortsätt' : t('continue');
      spec.goals = S.goals || [];
      spec.mainGoal = S.mainGoal;
    } else if (it.type === 'puzzle') {
      var P = it.puzzle || {};
      spec.title = t('puzzle') === 'puzzle' ? 'Uppgift' : t('puzzle');
      spec.prompt = interp(P.prompt || '');
      spec.hint = interp(P.hint || '');
      spec.puzzleType = P.type;
      spec.answers = P.answer || P.answers || [];
      if (typeof spec.answers === 'string') spec.answers = [spec.answers];
      spec.options = P.options || [];
      spec.items = P.items || [];
      spec.answer = P.answer;
      spec.wrong = t('puzzleWrong') === 'puzzleWrong' ? 'Inte riktigt. Pröva igen.' : t('puzzleWrong');
      spec.okLabel = t('puzzleTry') === 'puzzleTry' ? 'Pröva' : t('puzzleTry');
    } else if (it.type === 'gesture') {
      var key = 'gesture' + it.gesture.charAt(0).toUpperCase() + it.gesture.slice(1);
      spec.title = t('gestureDone') === 'gestureDone' ? '' : '';
      spec.hint = t(key);
      spec.gesture = it.gesture;
    } else if (it.type === 'breath') {
      spec.title = it.caption || t('breathTitle');
      spec.intro = it.intro || t('breathIntro');
      spec.continueLabel = t('continue');
      spec.t = t;
    }
    Panels.open(spec, function (res) {
      if (!res) return;
      if (it.type === 'write') {
        if (res.text) {
          S.reflections[page.chapter] = res.text;
          var dn = dayNum(page.chapter);
          if (dn != null) {
            if (window.Journey) Journey.ensureDay(S, dn);
            if (S.days[dn]) S.days[dn].reflection = res.text;
          }
        }
        if (page.id === 'intention' && res.text) S.intention = res.text;
        maxPage = Math.max(maxPage, Math.min(pages.length - 1, pageIndex + 1));
      } else if (it.type === 'name' && res.name) {
        S.name = res.name; S.started = true;
        maxPage = Math.max(maxPage, frontMatterEnd());
        if (Music.chime) Music.chime();
      } else if (it.type === 'choice' && (res.bird || res.id || res.label)) {
        if (it.options && it.options.length) {
          var key = dayNum(page.chapter);
          S.choices = S.choices || {};
          S.choices[key] = { id: res.id || res.bird, label: res.label };
          if (S.days[key]) S.days[key].choiceLabel = res.label;
        } else {
          S.bird = res.bird || res.id;
          toast(interp(t('youChose')));
        }
        maxPage = Math.max(maxPage, Math.min(pages.length - 1, pageIndex + 1));
        if (Music.chime) Music.chime();
      } else if (it.type === 'mission' && res.accepted) {
        var mn = dayNum(page.chapter);
        S.missions = S.missions || {};
        S.missions[mn] = true;
        if (S.days[mn]) S.days[mn].mission = true;
        maxPage = Math.max(maxPage, Math.min(pages.length - 1, pageIndex + 1));
        if (Music.chime) Music.chime();
        toast(t('missionAccepted') === 'missionAccepted' ? 'Uppdraget är antaget' : t('missionAccepted'));
      } else if (it.type === 'sign' && res.signed) {
        S.contract = {
          name: res.name, goal: res.goal, give: res.give,
          date: res.date, dateIso: res.date,
          signedAt: (window.Journey ? Journey.today() : ''),
          signature: res.signature || ''
        };
        if (res.name) S.name = res.name;
        S.onboarded = true;
        maxPage = Math.max(maxPage, Math.min(pages.length - 1, pageIndex + 1));
        if (Music.chime) Music.chime();
      } else if (it.type === 'goals' && res.goals) {
        S.goals = res.goals;
        S.mainGoal = res.mainGoal;
        maxPage = Math.max(maxPage, Math.min(pages.length - 1, pageIndex + 1));
      } else if (it.type === 'write') {
        // handled below too
      } else if (it.type === 'puzzle' && res.done) {
        var pn = dayNum(page.chapter);
        if (pn != null && S.days[pn]) S.days[pn].puzzle = true;
        maxPage = Math.max(maxPage, Math.min(pages.length - 1, pageIndex + 1));
        if (Music.chime) Music.chime();
      } else if (it.type === 'gesture' && res.done) {
        if (page.chapter) S.gestures[page.chapter] = true;
        maxPage = Math.max(maxPage, Math.min(pages.length - 1, pageIndex + 1));
      } else if (it.type === 'breath' && res.done) {
        maxPage = Math.max(maxPage, Math.min(pages.length - 1, pageIndex + 1));
      }
      S.maxPage = maxPage; save();
      expose();
      PagesView.refresh(pageIndex);
    });
  }

  function beginBook() {
    maxPage = Math.max(frontMatterEnd(), S.maxPage || 0);
    pageIndex = Math.min(S.page || 0, pages.length - 1);
    if (window.Journey && cfg.pace) {
      Journey.checkStreak(S);
      Journey.refreshUnlock(S, (cfg.book.days && cfg.book.days.length) || (cfg.book.chapters && cfg.book.chapters.length) || 30);
      capToUnlocked();
      save();
    }
    Tex.apply();
    applyTheme();
    Panels.mount(app);
    var savedLang = S.lang;
    setLang(savedLang || 'sv');
    if (!savedLang) S.lang = null;
    if (savedLang && S.started && S.page > 0) renderRead();
    else renderCover();
    document.addEventListener('pointerdown', function once() {
      document.removeEventListener('pointerdown', once);
      wakeSound();
    });
    if (!window.__bookFitBound) {
      window.__bookFitBound = true;
      var refit = function () { requestAnimationFrame(fitVisibleLeaves); };
      window.addEventListener('resize', refit);
      if (window.visualViewport) window.visualViewport.addEventListener('resize', refit);
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit).catch(function () {});
    }
    expose();
  }
  function start(opts) {
    cfg = opts;
    pages = opts.pages;
    S = fresh();
    loadSaved();
    app = opts.mount || document.getElementById('app');
    var intro = cfg.studioIntro;
    var skipIntro = false;
    try { if (window.__SKIP_STUDIOINTRO) skipIntro = true; } catch (e) {}
    if (intro && window.StudioIntro && !skipIntro) {
      StudioIntro.play({
        brand: intro.brand || 'kunskap',
        partners: intro.partners || [],
        copyright: intro.copyright || '© 2026 SkaparKvarnen (Skaparkvarnen, enskild firma). Alla rättigheter förbehållna.',
        onDone: function () { beginBook(); }
      });
    } else {
      beginBook();
    }
  }

  return { start: start, goToPage: goToPage, encodeCode: encodeCode, decodeCode: decodeCode };
})();

document.addEventListener('DOMContentLoaded', function () {
  if (window.BOOK_PAGES && window.BOOK) {
    BookEngine.start({
      mount: document.getElementById('app'),
      book: window.BOOK,
      pages: window.BOOK_PAGES,
      valleys: window.BOOK_VALLEYS,
      cover: window.BOOK_COVER,
      theme: window.BOOK_THEME || {},
      pace: window.BOOK_PACE || null,
      studioIntro: window.BOOK_INTRO || null,
      testMode: window.BOOK_TESTMODE,
      storageKey: window.BOOK_STORAGE || 'ak-birds-book-v1',
      legacyKey: window.BOOK_LEGACY || 'ak-birds-v1',
      uiExtra: window.BOOK_UI || {},
      title: (window.I18N_SV && window.I18N_SV.meta && window.I18N_SV.meta.title) || ''
    });
  }
});

</script>
